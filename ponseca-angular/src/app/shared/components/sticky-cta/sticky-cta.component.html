@if (!hideOnAdmin) {
  <div class="sticky-cta" role="region" aria-label="Acciones rápidas">
    <a routerLink="/reservas" class="sticky-cta__btn sticky-cta__btn--primary">
      <app-icon name="calendar" />
      <span>Reservar</span>
    </a>
    <a
      [href]="whatsappHref"
      target="_blank"
      rel="noopener"
      class="sticky-cta__btn sticky-cta__btn--whatsapp"
    >
      <app-icon name="whatsapp" />
      <span>WhatsApp</span>
    </a>
    <a [href]="phoneHref" class="sticky-cta__btn">
      <app-icon name="phone" />
      <span>Llamar</span>
    </a>
  </div>
}
